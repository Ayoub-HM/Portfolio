<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="comptiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="cysaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#comptiaGrad)"/>
  <!-- Hexagonal / Shield emblem -->
  <polygon points="50,14 84,32 84,68 50,86 16,68 16,32" fill="#090d16" stroke="#ffffff" stroke-width="2"/>
  <polygon points="50,19 79,35 79,65 50,81 21,65 21,35" fill="#dc2626" opacity="0.35"/>
  <g filter="url(#cysaGlow)">
    <text x="50" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CompTIA</text>
    <text x="50" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CySA+</text>
    <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="6.5" fill="#fca5a5" text-anchor="middle" letter-spacing="0.8">ANALYST</text>
  </g>
</svg>
